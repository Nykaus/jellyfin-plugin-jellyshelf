name: release

# Publishes the plugin as a Jellyfin repository on every version tag (e.g. v1.0.0.0):
#   - builds + packages the zip
#   - creates a GitHub Release with the zip attached
#   - updates manifest.json on the default branch (stable raw URL for Jellyfin)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package
        shell: pwsh
        run: >
          ./package.ps1
          -BaseUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          -Version "${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jellyfin-plugin-jellyshelf_*.zip

      - name: Publish manifest.json to default branch
        shell: bash
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          cp dist/manifest.json manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"
          cp dist/manifest.json manifest.json
          git add manifest.json
          git commit -m "Publish manifest for ${GITHUB_REF_NAME}" || echo "No manifest changes."
          git push origin "$DEFAULT_BRANCH"
